<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flappy Football: Top Bins Edition</title>
    <style>
        :root {
            --bg-dark: #090d16;
            --accent-green: #10b981;
            --neon-blue: #06b6d4;
            --gold: #f59e0b;
            --text-light: #f8fafc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: rgba(0, 0, 0, 0) !important;
            -webkit-tap-highlight-color: transparent !important;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            background: radial-gradient(circle at center, #1e1b4b 0%, #090d16 100%);
            touch-action: none;
            padding: 10px;
        }

        .game-container {
            text-align: center;
            position: relative;
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-size: 26px;
            font-weight: 900;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 20px rgba(16, 185, 129, 0.3);
        }

        h1 span {
            color: var(--accent-green);
        }

        .scoreboard {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 12px;
            font-size: 13px;
            font-weight: 700;
            background: rgba(15, 23, 42, 0.8);
            padding: 12px 16px;
            border-radius: 12px;
            border: 2px dashed #1e293b;
            backdrop-filter: blur(4px);
        }

        .score span { color: var(--accent-green); }
        .multiplier span { color: var(--neon-blue); }
        .high-score span { color: var(--gold); }

        canvas {
            background: linear-gradient(to bottom, #1e3a8a, #3b82f6);
            border: 4px solid #1e293b;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            display: block;
            max-width: 100%;
            height: auto;
            max-height: 65vh;
            aspect-ratio: 480 / 520;
        }

        .controls-hint {
            margin-top: 12px;
            font-size: 11px;
            color: #94a3b8;
            background: rgba(0,0,0,0.5);
            padding: 8px 14px;
            border-radius: 20px;
            width: 100%;
            line-height: 1.4;
            border: 1px solid #1e293b;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <h1>STRIKER: <span>TOP BINS</span></h1>
        
        <div class="scoreboard">
            <div class="score">Goals: <span id="current-score">0</span></div>
            <div class="multiplier">Mult: <span id="score-mult">x1</span></div>
            <div class="high-score">Record: <span id="high-score">0</span></div>
        </div>

        <canvas id="gameCanvas" width="480" height="520"></canvas>

        <div class="controls-hint">
            💻 **PC:** SPACE to kick. LEFT/RIGHT arrows to dash ball. <br>
            📱 **MOBILE:** Tap center to kick. Tap/Hold outer edges to DASH!
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let highScore = 0;
        try { highScore = localStorage.getItem('ftbHighScore') || 0; } catch (e) {}
        document.getElementById('high-score').innerText = highScore;

        let score = 0;
        let comboMultiplier = 1;
        let gameStarted = false;
        let gameOver = false;

        // Football Physics
        const ball = {
            x: 100,
            y: 220,
            radius: 13,
            gravity: 0.36,
            lift: -6.8,
            velocity: 0,
            xVelocity: 0, // Track dedicated side-to-side dash speeds
            rotation: 0
        };

        let obstacles = [];
        let targets = [];
        const obstacleWidth = 45;
        const obstacleGap = 170; 
        let obstacleSpeed = 2.6;
        let spawnTimer = 0;

        let keys = { curveLeft: false, curveRight: false };

        // Keyboard Inputs (Instantly sets swift dash movement velocity)
        window.addEventListener('keydown', e => {
            if (e.key === 'ArrowLeft' || e.key === 'a') {
                keys.curveLeft = true;
                ball.xVelocity = -3.5; // Snap dash left
            }
            if (e.key === 'ArrowRight' || e.key === 'd') {
                keys.curveRight = true;
                ball.xVelocity = 3.5;  // Snap dash right
            }
            if (e.key === ' ' || e.code === 'Space') {
                e.preventDefault();
                juggleBall();
            }
        });
        window.addEventListener('keyup', e => {
            if (e.key === 'ArrowLeft' || e.key === 'a') keys.curveLeft = false;
            if (e.key === 'ArrowRight' || e.key === 'd') keys.curveRight = false;
        });

        // Touch Interaction map configured for high speed side dashing
        function handlePointerStart(clientX) {
            if (gameOver) { resetGame(); return; }
            
            const rect = canvas.getBoundingClientRect();
            const relativeX = clientX - rect.left;
            const canvasWidthVisual = rect.width;

            // Side zones trigger immediate directional dash boosts
            if (relativeX < canvasWidthVisual * 0.25) {
                keys.curveLeft = true;
                ball.xVelocity = -4.0; // Mobile Dash Left!
                if (!gameStarted) gameStarted = true;
            } else if (relativeX > canvasWidthVisual * 0.75) {
                keys.curveRight = true;
                ball.xVelocity = 4.0;  // Mobile Dash Right!
                if (!gameStarted) gameStarted = true;
            } else {
                // Center taps trigger normal upward flight mechanics
                juggleBall();
            }
        }

        function handlePointerEnd() {
            keys.curveLeft = false;
            keys.curveRight = false;
        }

        canvas.addEventListener('mousedown', e => handlePointerStart(e.clientX));
        window.addEventListener('mouseup', handlePointerEnd);

        canvas.addEventListener('touchstart', e => {
            e.preventDefault();
            handlePointerStart(e.touches[0].clientX);
        }, { passive: false });
        window.addEventListener('touchend', handlePointerEnd);

        function juggleBall() {
            if (gameOver) { resetGame(); return; }
            if (!gameStarted) gameStarted = true;
            ball.velocity = ball.lift;
        }

        function spawnCustomPost() {
            const pad = 70;
            const openSpace = canvas.height - obstacleGap - pad - 50;
            const topHeight = Math.floor(Math.random() * openSpace) + pad;

            const goalieHeight = 50;
            const goalieMinY = topHeight + 5;
            const goalieMaxY = topHeight + obstacleGap - goalieHeight - 5;

            obstacles.push({
                x: canvas.width,
                top: topHeight,
                passed: false,
                goalieY: topHeight + (obstacleGap / 2) - (goalieHeight / 2),
                goalieDir: Math.random() > 0.5 ? 1 : -1,
                goalieSpeed: 1.8,
                goalieHeight: goalieHeight,
                goalieWidth: 16,
                minY: goalieMinY,
                maxY: goalieMaxY
            });

            targets.push({
                x: canvas.width + obstacleWidth / 2,
                y: topHeight + (obstacleGap / 2) + (Math.random() * 40 - 20),
                radius: 18,
                hit: false
            });
        }

        function resetGame() {
            ball.y = 220;
            ball.x = 100;
            ball.velocity = 0;
            ball.xVelocity = 0;
            ball.rotation = 0;
            obstacles = [];
            targets = [];
            score = 0;
            comboMultiplier = 1;
            obstacleSpeed = 2.6;
            document.getElementById('current-score').innerText = score;
            document.getElementById('score-mult').innerText = "x1";
            gameOver = false;
            gameStarted = false;
            spawnTimer = 0;
        }

        function drawFootball() {
            ctx.save();
            ctx.translate(ball.x, ball.y);
            ctx.rotate(ball.rotation);

            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(0, 0, ball.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#020617';
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.fillStyle = '#0f172a';
            ctx.beginPath();
            ctx.arc(0, 0, 4, 0, Math.PI*2);
            ctx.fill();

            ctx.strokeStyle = '#334155';
            ctx.lineWidth = 1.5;
            for(let i=0; i<5; i++) {
                let a = (Math.PI*2/5) * i;
                ctx.beginPath();
                ctx.moveTo(0,0);
                ctx.lineTo(Math.cos(a)*ball.radius, Math.sin(a)*ball.radius);
                ctx.stroke();
            }
            ctx.restore();
        }

        function drawStadiumObstacles() {
            obstacles.forEach(obs => {
                let gradient = ctx.createLinearGradient(obs.x, 0, obs.x + obstacleWidth, 0);
                gradient.addColorStop(0, '#e2e8f0');
                gradient.addColorStop(0.4, '#ffffff');
                gradient.addColorStop(1, '#94a3b8');

                ctx.fillStyle = gradient;
                ctx.fillRect(obs.x, 0, obstacleWidth, obs.top);
                ctx.strokeStyle = '#1e293b';
                ctx.strokeRect(obs.x, -5, obstacleWidth, obs.top + 5);

                let bottomY = obs.top + obstacleGap;
                let bottomHeight = canvas.height - bottomY;
                ctx.fillRect(obs.x, bottomY, obstacleWidth, bottomHeight);
                ctx.strokeRect(obs.x, bottomY, obstacleWidth, bottomHeight + 5);

                ctx.save();
                ctx.shadowBlur = 8;
                ctx.shadowColor = '#ef4444';
                
                ctx.fillStyle = '#ef4444';
                ctx.fillRect(obs.x + 12, obs.goalieY, obs.goalieWidth, obs.goalieHeight);
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 1;
                ctx.strokeRect(obs.x + 12, obs.goalieY, obs.goalieWidth, obs.goalieHeight);
                ctx.restore();
            });

            targets.forEach(t => {
                if(t.hit) return;
                ctx.save();
                ctx.shadowBlur = 12;
                ctx.shadowColor = '#06b6d4';
                ctx.strokeStyle = '#06b6d4';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(t.x, t.y, t.radius, 0, Math.PI*2);
                ctx.stroke();
                ctx.restore();
            });
        }

        function drawPitchGrass() {
            for(let i=0; i<canvas.width; i+=40) {
                ctx.fillStyle = (i / 40 % 2 === 0) ? '#15803d' : '#166534';
                ctx.fillRect(i, canvas.height - 40, 40, 40);
            }
            ctx.fillStyle = 'rgba(255,255,255,0.4)';
            ctx.fillRect(0, canvas.height - 40, canvas.width, 3);
        }

        function drawUIPanels() {
            if (!gameStarted && !gameOver) {
                ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
                ctx.fillRect(40, 140, canvas.width - 80, 210);
                ctx.strokeStyle = '#10b981';
                ctx.lineWidth = 2;
                ctx.strokeRect(40, 140, canvas.width - 80, 210);

                ctx.fillStyle = '#ffffff';
                ctx.font = '900 20px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('ENTER THE ARENA', canvas.width / 2, 185);
                
                ctx.fillStyle = '#94a3b8';
                ctx.font = '13px sans-serif';
                ctx.fillText('Tap Center to Kick Up', canvas.width / 2, 215);
                ctx.fillText('Tap Left/Right edges to DASH', canvas.width / 2, 240);

                ctx.fillStyle = 'rgba(6, 182, 212, 0.5)';
                ctx.font = '11px sans-serif';
                ctx.fillText('⬅️ Tap Left edge to dash left', canvas.width / 2, 275);
                ctx.fillText('Tap Right edge to dash right ➡️', canvas.width / 2, 295);
            }

            if (gameOver) {
                ctx.fillStyle = 'rgba(9, 13, 22, 0.92)';
                ctx.fillRect(50, 160, canvas.width - 100, 160);
                ctx.strokeStyle = '#ef4444';
                ctx.strokeRect(50, 160, canvas.width - 100, 160);
                
                ctx.fillStyle = '#ef4444';
                ctx.font = '900 24px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('SAVED! MATCH OVER', canvas.width / 2, 205);

                ctx.font = 'bold 15px sans-serif';
                ctx.fillStyle = '#ffffff';
                ctx.fillText(`Final Goals Scored: ${score}`, canvas.width / 2, 245);
                ctx.fillStyle = '#fbbf24';
                ctx.fillText('Tap Center to retry', canvas.width / 2, 285);
            }
        }

        function executionLoop() {
            ctx.fillStyle = '#1e3a8a';
            ctx.fillRect(0,0, canvas.width, canvas.height);

            if (gameStarted && !gameOver) {
                ball.velocity += ball.gravity;
                ball.y += ball.velocity;
                
                // Process smooth deceleration for horizontal dash mechanics
                ball.x += ball.xVelocity;
                ball.rotation += 0.05 + (ball.xVelocity * 0.03);

                if (keys.curveLeft) {
                    ball.xVelocity = -2.2;
                } else if (keys.curveRight) {
                    ball.xVelocity = 2.2;
                } else {
                    // Friction pulls the ball back to center default alignment when released
                    ball.xVelocity *= 0.88;
                    if (Math.abs(ball.xVelocity) < 0.1) ball.xVelocity = 0;
                    
                    if (ball.x > 100) ball.x -= 0.8;
                    if (ball.x < 100) ball.x += 0.8;
                }

                ball.x = Math.max(40, Math.min(canvas.width - 120, ball.x));

                spawnTimer++;
                if (spawnTimer >= 105) {
                    spawnCustomPost();
                    spawnTimer = 0;
                }

                for (let i = obstacles.length - 1; i >= 0; i--) {
                    let obs = obstacles[i];
                    obs.x -= obstacleSpeed;

                    obs.goalieY += obs.goalieSpeed * obs.goalieDir;
                    if (obs.goalieY < obs.minY || obs.goalieY > obs.maxY) {
                        obs.goalieDir *= -1;
                    }

                    if (!obs.passed && obs.x + obstacleWidth < ball.x) {
                        score += 1 * comboMultiplier;
                        document.getElementById('current-score').innerText = score;
                        obs.passed = true;

                        if(score % 3 === 0) obstacleSpeed += 0.2;

                        if (score > highScore) {
                            highScore = score;
                            document.getElementById('high-score').innerText = highScore;
                            try { localStorage.setItem('ftbHighScore', highScore); } catch(e){}
                        }
                    }

                    if (ball.x + ball.radius - 2 > obs.x && ball.x - ball.radius + 2 < obs.x + obstacleWidth) {
                        if (ball.y - ball.radius + 2 < obs.top || ball.y + ball.radius - 2 > obs.top + obstacleGap) {
                            gameOver = true;
                        }
                    }

                    if (ball.x + ball.radius - 2 > obs.x + 6 && ball.x - ball.radius + 2 < obs.x + 12 + obs.goalieWidth) {
                        if (ball.y + ball.radius - 2 > obs.goalieY && ball.y - ball.radius + 2 < obs.goalieY + obs.goalieHeight) {
                            gameOver = true;
                        }
                    }

                    if (obs.x + obstacleWidth < 0) obstacles.splice(i, 1);
                }

                for (let i = targets.length - 1; i >= 0; i--) {
                    let t = targets[i];
                    t.x -= obstacleSpeed;

                    let dist = Math.hypot(ball.x - t.x, ball.y - t.y);
                    if(!t.hit && dist < ball.radius + t.radius) {
                        t.hit = true;
                        comboMultiplier = 2;
                        document.getElementById('score-mult').innerText = "x2 (HOT!)";
                        
                        setTimeout(() => {
                            comboMultiplier = 1;
                            document.getElementById('score-mult').innerText = "x1";
                        }, 3500);
                    }

                    if(t.x + 30 < 0) targets.splice(i, 1);
                }

                if (ball.y + ball.radius >= canvas.height - 40) {
                    gameOver = true;
                }
                if (ball.y - ball.radius <= 0) {
                    ball.y = ball.radius;
                    ball.velocity = 1;
                }
            }

            drawStadiumObstacles();
            drawPitchGrass();
            drawFootball();
            drawUIPanels();

            requestAnimationFrame(executionLoop);
        }

        executionLoop();
    </script>
</body>
</html>
