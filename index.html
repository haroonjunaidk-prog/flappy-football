<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Play Flappy Football: Top Bins Edition - Free Arcade Browser Game</title>
    <meta name="description" content="Play Flappy Football: Top Bins Edition! Face narrow goalposts, bypass stationary blockers, and conquer rapid goalkeepers in this addictive browser arcade game.">
    <meta name="keywords" content="flappy football, top bins, arcade football game, browser soccer game, play flappy bird football, free online games">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://yourdomain.com/flappy-football" />

    <meta property="og:type" content="website">
    <meta property="og:url" content="https://yourdomain.com/flappy-football">
    <meta property="og:title" content="Flappy Football: Top Bins Edition">
    <meta property="og:description" content="Test your timing against narrow gaps and adaptive goalkeepers. Play the game directly in your browser.">
    <meta property="og:image" content="https://yourdomain.com/assets/game-preview.jpg">

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "VideoGame",
      "name": "Flappy Football: Top Bins Edition",
      "description": "An addictive browser-based arcade sports game where players fly a football through narrow goalposts.",
      "genre": ["Arcade Game", "Sports Game"],
      "playMode": "SinglePlayer",
      "applicationCategory": "Game",
      "operatingSystem": "Windows, macOS, Android, iOS",
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
    }
    </script>

    <style>
        :root { --stadium-blue: #3b82f6; --grass-green: #22c55e; --gold: #fcd34d; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; }
        body { background: #1e293b; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
        #game-box { position: relative; width: 500px; height: 530px; border: 6px solid #475569; border-radius: 16px; background: #3b82f6; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        canvas { display: block; position: absolute; top: 0; left: 0; z-index: 1; }
        .ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; background: rgba(30, 41, 59, 0.4); backdrop-filter: blur(6px); display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 30px; transition: opacity 0.2s; }
        .hidden { opacity: 0; pointer-events: none; }
        h1 { font-size: 2.2rem; font-weight: 900; color: #ffffff; text-transform: uppercase; margin-bottom: 10px; text-shadow: 0 4px 8px rgba(0,0,0,0.3); }
        .btn { background: #22c55e; color: white; border: none; padding: 12px 24px; font-weight: bold; border-radius: 8px; cursor: pointer; text-transform: uppercase; margin: 5px; transition: transform 0.1s; }
        .btn:hover { transform: scale(1.05); }
        #username-field { background: rgba(0,0,0,0.3); border: 2px solid #fff; color: white; padding: 10px; border-radius: 8px; margin-bottom: 10px; text-align: center; width: 200px; }
        #game-hud { position: absolute; top: 15px; left: 15px; right: 15px; display: flex; justify-content: space-between; pointer-events: none; z-index: 5; }
        .hud-pill { background: rgba(15, 23, 42, 0.6); color: white; padding: 6px 12px; border-radius: 8px; font-weight: bold; font-size: 0.9rem; }
    </style>
</head>
<body>

<div id="game-box">
    <div id="game-hud" class="hidden">
        <div id="hud-score" class="hud-pill">Goals: 0</div>
        <div id="hud-phase" class="hud-pill">Phase 1</div>
    </div>

    <div id="layer-username" class="ui-layer">
        <h1>STRIKER PROFILE</h1>
        <input type="text" id="username-field" placeholder="INITIALS" maxlength="12">
        <button id="btn-save-profile" class="btn">Enter Arena</button>
    </div>

    <div id="layer-dashboard" class="ui-layer hidden">
        <h1>TOP BINS</h1>
        <button id="opt-endless" class="btn">Endless Run</button>
        <button id="opt-stages" class="btn">Stage Mode</button>
        <div id="dashboard-lb-rows" style="margin-top:20px; color:white; font-size: 0.8rem; text-align: center;"></div>
    </div>

    <div id="layer-stages" class="ui-layer hidden">
        <h1>SELECT STAGE</h1>
        <div style="display:flex; gap:10px;">
            <button class="stage-node btn" data-stg="1">Stage 1</button>
            <button class="stage-node btn" data-stg="2">Stage 2</button>
            <button class="stage-node btn" data-stg="3">Stage 3</button>
        </div>
        <button class="btn btn-to-hub" style="background:#64748b;">Dashboard</button>
    </div>

    <div id="layer-matchover" class="ui-layer hidden">
        <h1 id="mo-title">FULL TIME</h1>
        <p id="mo-stats" style="color:white; margin-bottom:20px; font-size: 1.2rem;"></p>
        <div style="display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;">
            <button id="btn-rematch" class="btn">Rematch</button>
            <button id="btn-next-stage" class="btn hidden">Next Level</button>
            <button class="btn btn-to-hub" style="background:#64748b;">Menu</button>
        </div>
    </div>

    <canvas id="arenaCanvas" width="500" height="530"></canvas>
</div>

<script>
    // --- APP STATE ---
    let session = {
        player: localStorage.getItem('ft_user') || '',
        highestUnlocked: parseInt(localStorage.getItem('ft_highstg')) || 1,
        board: JSON.parse(localStorage.getItem('ft_scores')) || [
            {name: "MESSI BOT", score: 15}, {name: "RONALDO BOT", score: 12}, {name: "NEYMAR BOT", score: 9}
        ]
    };
    
    const canvas = document.getElementById('arenaCanvas');
    const ctx = canvas.getContext('2d');
    const BALANCER = { gravity: 0.22, jumpForce: -5.5, dashForce: 6, forwardSpeed: 2.4, gapSize: 125, ballSize: 13 };
    
    let isRunning = false, score = 0, posts = [], keeper = {}, ball = {}, currentMode = 'endless', currentStage = 1;

    // --- INPUTS ---
    window.addEventListener('keydown', (e) => {
        if (!isRunning) return;
        const isJump = e.code === 'KeyA' || e.key === 'ArrowUp' || e.code === 'Space';
        const isDash = e.code === 'KeyD' || e.key === 'ArrowRight';
        if (isJump) ball.velocity = BALANCER.jumpForce;
        if (isDash) ball.x += BALANCER.dashForce * 8; // Instant forward dash
    });

    // --- GAME ENGINE ---
    function setupMatchSession() {
        popUI(null);
        document.getElementById('game-hud').classList.remove('hidden');
        score = 0; posts = []; isRunning = true;
        ball = { x: 130, y: 180, velocity: 0, angle: 0, radius: BALANCER.ballSize };
        keeper = { active: false, x: 0, y: 0, width: 30, height: 40, mode: 'none' };
        spawnGoalpostUnit(460);
        spawnGoalpostUnit(460 + 220);
        requestAnimationFrame(engineLoop);
    }

    function engineLoop() {
        if (!isRunning) return;
        
        ball.velocity += BALANCER.gravity;
        ball.y += ball.velocity;
        ball.angle += 0.05;

        if (ball.y + ball.radius > canvas.height - 40 || ball.y - ball.radius < 0) return terminateMatchSession(false);

        let nearestPost = posts.find(p => p.x + 55 > ball.x - ball.radius);
        updateKeeperLogic(nearestPost);
        
        posts.forEach(p => {
            p.x -= BALANCER.forwardSpeed;
            if (ball.x + ball.radius > p.x && ball.x - ball.radius < p.x + 55) {
                if (ball.y - ball.radius < p.topHeight || ball.y + ball.radius > p.bottomY) return terminateMatchSession(false);
            }
            if (!p.scored && p.x + 25 < ball.x) { p.scored = true; score++; updateHUD(); }
        });

        if (posts[posts.length - 1].x < canvas.width - 220) spawnGoalpostUnit(canvas.width);
        if (posts[0] && posts[0].x < -60) posts.shift();

        render();
        requestAnimationFrame(engineLoop);
    }

    function updateKeeperLogic(p) {
        if (!p) return;
        keeper.active = false;
        if (currentMode === 'endless') {
            if (score > 10 && score <= 20) { keeper.active = true; keeper.mode = 'still'; keeper.x = p.x + 10; keeper.y = p.topHeight + (Math.random() < 0.5 ? 5 : BALANCER.gapSize - 45); }
            else if (score > 20) { keeper.active = true; keeper.mode = 'patrol'; keeper.x = p.x + 10; }
        } else {
            if (currentStage === 2) { keeper.active = true; keeper.mode = 'still'; keeper.x = p.x + 10; keeper.y = p.topHeight + (Math.random() < 0.5 ? 5 : BALANCER.gapSize - 45); }
            else if (currentStage === 3) { keeper.active = true; keeper.mode = 'patrol'; keeper.x = p.x + 10; }
        }
        
        // Patrol Logic
        if(keeper.mode === 'patrol') {
            keeper.y = p.topHeight + (Math.sin(Date.now() * 0.005) * (BALANCER.gapSize - 45)) + 5;
        }
    }

    // --- UI/UTILS ---
    function popUI(id) {
        document.querySelectorAll('.ui-layer').forEach(l => l.classList.add('hidden'));
        if (id) document.getElementById(id).classList.remove('hidden');
    }

    function updateHUD() {
        document.getElementById('hud-score').innerText = `Goals: ${score}`;
        document.getElementById('hud-phase').innerText = currentMode === 'endless' ? (score <= 10 ? 'Phase 1' : score <= 20 ? 'Phase 2' : 'Phase 3') : `Stage ${currentStage}`;
    }

    function terminateMatchSession(win) {
        isRunning = false;
        document.getElementById('mo-title').innerText = win ? "GOAL CLEARED" : "FULL TIME";
        document.getElementById('mo-stats').innerText = `Score: ${score}`;
        document.getElementById('btn-next-stage').classList.toggle('hidden', !(win && currentMode === 'stages' && currentStage < 3));
        popUI('layer-matchover');
    }

    function spawnGoalpostUnit(x) {
        let h = Math.floor(Math.random() * 200) + 50;
        posts.push({ x: x, topHeight: h, bottomY: h + BALANCER.gapSize, scored: false });
    }

    function render() {
        ctx.fillStyle = '#3b82f6'; ctx.fillRect(0,0,500,530);
        ctx.fillStyle = '#16a34a'; ctx.fillRect(0, 490, 500, 40);
        posts.forEach(p => { ctx.fillStyle = '#fff'; ctx.fillRect(p.x, 0, 55, p.topHeight); ctx.fillRect(p.x, p.bottomY, 55, 530); });
        if (keeper.active) { ctx.fillStyle = '#e11d48'; ctx.fillRect(keeper.x, keeper.y, 30, 40); }
        ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(ball.x, ball.y, 13, 0, Math.PI*2); ctx.fill();
    }

    // --- EVENT LISTENERS ---
    document.getElementById('btn-save-profile').onclick = () => {
        let val = document.getElementById('username-field').value.toUpperCase();
        if (val.length < 2) return alert("Enter a name!");
        if (session.board.some(r => r.name === val)) alert('This name is already taken!');
        else { session.player = val; localStorage.setItem('ft_user', val); popUI('layer-dashboard'); }
    };
    document.getElementById('opt-endless').onclick = () => { currentMode = 'endless'; setupMatchSession(); };
    document.getElementById('opt-stages').onclick = () => popUI('layer-stages');
    document.getElementById('btn-next-stage').onclick = () => { currentStage++; setupMatchSession(); };
    document.getElementById('btn-rematch').onclick = setupMatchSession;
    document.querySelectorAll('.btn-to-hub').forEach(b => b.onclick = () => popUI('layer-dashboard'));
    document.querySelectorAll('.stage-node').forEach(b => b.onclick = (e) => { 
        currentMode = 'stages'; 
        currentStage = parseInt(e.target.dataset.stg); 
        if(currentStage <= session.highestUnlocked) setupMatchSession();
        else alert("Level locked!");
    });

    if(session.player) popUI('layer-dashboard');
</script>
</body>
</html>
